version: "3.8"

services:
  # -------------------------------------------------------------------
  # 基础设施服务 (Infrastructure)
  # -------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: hmall
    volumes:
      - ./sql:/docker-entrypoint-initdb.d # 自动初始化 SQL
      - ./data/mysql:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - hm-net

  nacos:
    image: nacos/nacos-server:v2.2.1
    container_name: nacos
    environment:
      - MODE=standalone
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - hm-net

  rabbitmq:
    image: rabbitmq:3.9-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: hmall
      RABBITMQ_DEFAULT_PASS: hmall123
    ports:
      - "15672:15672"
      - "5672:5672"
    networks:
      - hm-net

  seata:
    image: seataio/seata-server:1.5.2
    container_name: seata
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      - SEATA_PORT=8091
      - STORE_MODE=db
      - SEATA_IP=seata
      - SEATA_CONFIG_NAME=file:/root/seata-config/registry
    volumes:
      - ./seata-config:/root/seata-config
    networks:
      - hm-net
    depends_on:
      - nacos
      - mysql

  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: sentinel
    ports:
      - "8090:8858"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - hm-net

  # -------------------------------------------------------------------
  # 微服务 (Microservices)
  # -------------------------------------------------------------------
  hm-gateway:
    build: ./hm-gateway
    container_name: hm-gateway
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
    networks:
      - hm-net
    depends_on:
      - nacos

  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD=sentinel:8858
      - HM_DB_HOST=mysql
    networks:
      - hm-net
    depends_on:
      - nacos
      - mysql
      - sentinel

  item-service:
    build: ./item-service
    container_name: item-service
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD=sentinel:8858
      - HM_DB_HOST=mysql
    networks:
      - hm-net
    depends_on:
      - nacos
      - mysql
      - sentinel

  cart-service:
    build: ./cart-service
    container_name: cart-service
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD=sentinel:8858
      - HM_DB_HOST=mysql
    networks:
      - hm-net
    depends_on:
      - nacos
      - mysql
      - sentinel

  trade-service:
    build: ./trade-service
    container_name: trade-service
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD=sentinel:8858
      - HM_DB_HOST=mysql
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=hmall
      - SPRING_RABBITMQ_PASSWORD=hmall123
    networks:
      - hm-net
    depends_on:
      - nacos
      - mysql
      - rabbitmq
      - sentinel

  pay-service:
    build: ./pay-service
    container_name: pay-service
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD=sentinel:8858
      - HM_DB_HOST=mysql
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=hmall
      - SPRING_RABBITMQ_PASSWORD=hmall123
    networks:
      - hm-net
    depends_on:
      - nacos
      - mysql
      - rabbitmq
      - sentinel

  # -------------------------------------------------------------------
  # 前端 Nginx (Frontend)
  # -------------------------------------------------------------------
  nginx:
    build: ./hmall-nginx
    container_name: nginx
    ports:
      - "80:80"
      - "18080:18080"
      - "18081:18081"
      - "18082:18082"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - hm-net
    depends_on:
      - hm-gateway

networks:
  hm-net:
    driver: bridge